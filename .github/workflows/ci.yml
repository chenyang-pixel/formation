name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - name: Couverture des devis (80 % des lignes et des branches)
        # Charger le calcul même si ses tests sont supprimés : zéro test ne vaut pas 100 %.
        run: >-
          node --disable-warning=ExperimentalWarning --test --experimental-test-coverage
          --require=./src/devis/calcul.js
          --test-coverage-include='src/devis/**'
          --test-coverage-lines=80 --test-coverage-branches=80

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Gitleaks 8.30.1
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          # SHA-256 publié dans gitleaks_8.30.1_checksums.txt, sur la même release.
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          sudo tar xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Analyser l'historique de la branche testée
        # Inclure les changements introduits uniquement dans un commit de fusion.
        run: gitleaks git -v --no-banner --redact --log-opts="--full-history -m HEAD" .
